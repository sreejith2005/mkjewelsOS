name: Source validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jewelos/core test
      - run: pnpm --filter @jewelos/data test
      - run: pnpm --filter @jewelos/crm-ui test
      - run: pnpm --filter web test
      - run: pnpm exec turbo run typecheck --force --concurrency=1
      - run: pnpm exec turbo run build --force --concurrency=1
      - run: pnpm check:web-performance
      - run: git diff --check
