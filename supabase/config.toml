# Platform JWT verification is disabled only because this handler verifies the
# deployment secret from x-cron-secret before parsing input or accessing data.
[functions.generate-recurring-tasks]
verify_jwt = false

# This worker verifies a dedicated server-side x-cron-secret before any body
# parsing or database access. No browser client may invoke it.
[functions.process-notification-outbox]
verify_jwt = false

# Dedicated scheduler secret is verified before body parsing or database work.
[functions.process-report-exports]
verify_jwt = false

# This is the public login entry point. It validates bodies, uses a private
# salted rate-limit key, and returns generic credential failures.
[functions.username-password-login]
verify_jwt = false
