project_id = "jewelos"

# The old CRM schemas (crm, crm_private, crm_sync) were dropped in 0443; the hosted
# project's "Exposed schemas" must match (public, graphql_public).
[api]
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

# Platform JWT verification is disabled only because this handler verifies the
# deployment secret from x-cron-secret before parsing input or accessing data.
[functions.generate-recurring-tasks]
verify_jwt = false

# This worker verifies a dedicated server-side x-cron-secret before any body
# parsing or database access. No browser client may invoke it.
[functions.process-notification-outbox]
verify_jwt = false

[functions.process-report-exports]
verify_jwt = false

# This is the public login entry point. It validates bodies, uses a private
# salted rate-limit key, and returns generic credential failures.
[functions.username-password-login]
verify_jwt = false

# Ask Kiara insights job (pg_cron and the Super Admin refresh RPC, through pg_net). It verifies
# x-cron-secret (KIARA_INSIGHTS_CRON_SECRET, constant-time) before parsing the body or touching
# the database, and then calls only the service-role Kiara RPCs of migration 0220.
[functions.kiara-insights]
verify_jwt = false

# Session handler validates the caller JWT through the caller-scoped RPC.
[functions.recorder-session]
verify_jwt = true

# Dedicated server-only constant-time shared secret; never an AWS service-role key.
[functions.recorder-ingest]
verify_jwt = false

# Dedicated scheduler secret is verified before body parsing, Google access or
# database work. Reads Google Sheets with a read-only scope.
[functions.customer-sheets-sync]
verify_jwt = false
