project_id = "jewelos"

# The original CRM is ported into schema crm (0181-0186) and is queried as
# supabase.schema("crm"). crm is deliberately not on extra_search_path: its table
# names (clients, client_timeline, ...) overlap public ones. crm_private is internal
# and must never be exposed. The hosted project needs the same "Exposed schemas".
[api]
schemas = ["public", "graphql_public", "crm"]
extra_search_path = ["public", "extensions"]

# Platform JWT verification is disabled only because this handler verifies the
# deployment secret from x-cron-secret before parsing input or accessing data.
[functions.generate-recurring-tasks]
verify_jwt = false

# This worker verifies a dedicated server-side x-cron-secret before any body
# parsing or database access. No browser client may invoke it.
[functions.process-notification-outbox]
verify_jwt = false

# Dedicated scheduler secret is verified before body parsing or database work.
[functions.process-report-exports]
verify_jwt = false

# This is the public login entry point. It validates bodies, uses a private
# salted rate-limit key, and returns generic credential failures.
[functions.username-password-login]
verify_jwt = false

# Google Apps Script cannot send a JWT. This function checks the x-mk-legacy-api-key header
# against the CRM_LEGACY_WALKIN_INGEST_API_KEY function secret (constant-time) before it
# rate-limits, parses the body or touches the database.
[functions.crm-walkin-ingest]
verify_jwt = false

# Signed-in CRM staff only: the caller's JewelOS JWT is verified by the platform and the
# function reads and writes as that caller under crm RLS. RUNO_API_KEY is a function secret.
[functions.crm-runo-push]
verify_jwt = true
